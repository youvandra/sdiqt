name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: prover, verifier, watchtower, operator, explorer, spec
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
