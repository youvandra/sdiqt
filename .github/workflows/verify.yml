name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Bundles carry compressed STARKs only; the verifier must never reach the
      # SP1 Groth16 or Plonk wrappers, in its own code or through a dependency feature.
      - name: Verifier uses the STARK path only
        run: |
          set -euo pipefail
          if grep -rniE 'groth16|plonk' --include='*.rs' --include='*.ts' --include='Cargo.toml' \
            crates/sdiqt-verify crates/sdiqt-statement packages/verify/src; then
            echo "::error::verifier sources name Groth16 or Plonk"
            exit 1
          fi
          tree=$(cargo tree --locked -p sdiqt-verify --all-features --target all -e normal,features)
          if grep -iE 'groth16|plonk|sp1-verifier feature "ark"' <<<"$tree"; then
            echo "::error::verifier dependency tree pulls in Groth16 or Plonk"
            exit 1
          fi
          grep -q 'sp1-verifier v' <<<"$tree" || { echo "::error::sp1-verifier missing from the tree"; exit 1; }
          echo "ok: compressed STARK path only"
      - name: Test
        run: scripts/ci-rust-test.sh

  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated constants are current
        run: node scripts/gen-constants.mjs --check
      - name: Spec vectors and schemas are current
        run: |
          node packages/protocol/scripts/vectors.ts --check
          node apps/watchtower/scripts/exit-vectors.ts --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tracked files
        run: node scripts/check-hygiene.mjs
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-hygiene.mjs --commits "$BASE..$HEAD"
