name: e2e

# The demo path (list -> batch -> browser verify -> flip one byte) against the
# deployed explorer at https://sdiqt.xyz.
on:
  pull_request:
    paths: ["apps/explorer/**", "packages/verify/**", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
    paths: ["apps/explorer/**", "packages/verify/**", ".github/workflows/e2e.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  demo-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir apps/explorer exec playwright install --with-deps chromium
      - name: Demo path on https://sdiqt.xyz
        run: pnpm --dir apps/explorer e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/explorer/playwright-report/
            apps/explorer/test-results/
          retention-days: 14
