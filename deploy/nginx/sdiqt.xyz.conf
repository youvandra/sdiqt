# sdiqt.xyz: watchtower API, proof bundles and a read-only diana relay.
# certbot adds the TLS server block and the HTTP redirect.

limit_req_zone $binary_remote_addr zone=sdiqt_chain:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=sdiqt_exits:1m rate=10r/m;

server {
    listen 80;
    server_name sdiqt.xyz www.sdiqt.xyz;

    root /var/www/sdiqt;
    index index.html;

    # Exit packets v1: the only write route. A packet is about 16 kB.
    # GET /api/exits/<account> stays on the read-only /api/ block.
    location ~ "^/api/exits(/cancel)?$" {
        limit_except POST { deny all; }
        limit_req zone=sdiqt_exits burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Watchtower JSON API (sdiqt-watchtower.service).
    # Every other qledger-v1 rollup comes from the watch-only fleet tower.
    location ~ "^/api/(rollups$|r/)" {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8803;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # diana's REST has no CORS, so the browser reads chain data through here.
    # Read-only and limited to the rollup module and tx lookups.
    location ~ "^/api/chain/(qorechain/rdk/v1/|cosmos/tx/v1beta1/txs/[0-9A-Fa-f]{64}$)" {
        limit_except GET HEAD { deny all; }
        limit_req zone=sdiqt_chain burst=20 nodelay;
        rewrite ^/api/chain/(.*)$ /$1 break;
        proxy_pass https://api-testnet.qore.host;
        proxy_ssl_server_name on;
        proxy_set_header Host api-testnet.qore.host;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 20s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Relayed-By "sdiqt.xyz" always;
    }
    location /api/chain/ { return 404; }

    # Proof bundles: written once per batch, never changed.
    location /bundles/ {
        alias /srv/sdiqt/bundles/;
        autoindex on;
        limit_except GET HEAD { deny all; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml;

    # Hashed Vite output: cache for good; a missing chunk 404s so a stale tab reloads.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Every explorer route is the SPA; the shell is never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html =404;
    }
}
