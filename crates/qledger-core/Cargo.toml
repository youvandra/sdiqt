[package]
name = "qledger-core"
version = "0.1.0"
description = "qledger-v1 execution (state tree, transactions, inbox) for host and zkVM guest"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha2 = { version = "0.10", features = ["compress"] }
sha3 = "0.10"
bech32 = "0.11"
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-44"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
sha2 = { version = "0.10", features = ["compress"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
